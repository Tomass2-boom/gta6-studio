[project]
name = "studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "requests",
    "mlx-whisper; sys_platform == 'darwin'",
    "typer",
    "python-dotenv",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "opencv-python-headless>=4.10,<5",
    "websockets>=17.4",
    "flask>=3.1.3",
    "pywebview>=6.2.1",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
studio = "studio.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]
