review:
  mode: manual        # manual = nothing posts without approval
  # Control app (studio review): suggested description for posting by hand. {title} {streamer} {platform}
  # {hashtags} are filled in; swear words are masked like the captions.
  description_template: "{title} 😱\n\nClip from {streamer} on {platform}. Follow for more GTA 6 clips!\n\n{hashtags}"
  default_hashtags: "#gta6 #gta #gaming #shorts"
  always_hashtags: "#shorts"   # added to every clip's hashtags if missing
  port: 8642                   # the app's local page: http://127.0.0.1:8642 (next free port if taken)
ingest:
  max_height: 1080   # source quality; platforms favour 1080p
judge:
  model: qwen3.8:27b
  ollama_url: http://localhost:11434
  # Launch-day hook titles (user 2026-11-18): GTA 6 unlocks in NZ first, most viewers don't know it's out,
  # so code puts a big true hook in front of the judge's title. Only for live streams after from_utc, or transcripts that name GTA 6
  # (never a GTA 5 video). Layout C shows the hook as its own line on the video; every layout gets it in the
  # Shorts title. Turn off (enabled: false) once everyone knows.
  launch:
    enabled: true
    game: GTA 6
    from_utc: "2026-11-18T11:00:00Z"   # NZ unlock
    until_utc: "2026-11-21T00:00:00Z"  # US/EU unlock is Thu 05:00 UTC; the "already out?!" surprise fades after
    hooks: ["GTA 6 IS ALREADY OUT", "GTA 6 JUST DROPPED", "GTA 6 IS OUT EARLY"]   # rotate per clip
    first_look_hook: "GTA 6 FIRST LOOK"   # when the streamer sees menus / creator / first drive etc. for the first time
    on_video_max_score: 6   # hook drawn on the video (C hook line, A/B banner) only for clips scored this or lower
    hook_color: FFE600   # the hook line on the layout C title, own colour so it pops
whisper:
  model: mlx-community/whisper-large-v3-turbo
  language: en
  pad_s: 2.0                      # extra audio each side so edge words are heard whole
  condition_on_previous_text: false  # true makes Whisper repeat itself in noisy parts
  # Example text in the style we want: makes Whisper write screams/laughs instead of skipping them.
  initial_prompt: "AAAAAH! Oh my god! NOOO! Hahaha, bro what?! AHHH!"
  retries: 2                      # re-run when Whisper falls back (screams); keep the fullest run
  max_word_chars: 10              # cut 'AHHHHHHH...' to this length
  hallucination_silence_s: null   # off: it also drops screams (2.0 lost the AAAAAH in clip 1873)
clip:
  pre_roll_s: 20
  post_roll_s: 40
  max_len_s: 45           # hard cap (was 60). Clipper hits on launch day were mostly 7-24 s (study 2026-11-18)
  target_len_s: [8, 30]   # what the judge aims for: setup line to payoff, nothing after
  end_pad_s: 0.8          # after snapping the end to the end of the sentence (ratings: endings were cut off)
  max_frozen_share: 0.6   # drop a clip whose picture stands still this much of the time (capture card "No input signal", BRB screens). 1 = off
  min_score: 6
  loud_z: 1.8        # lower = more candidates
  max_window_s: 90   # cap on a merged candidate window
  min_len_s: 7       # was 15: a short cut was padded with 7+ s of trailing chatter
  heatmap_min: 0.6
  merge_gap_s: 30
render:
  # ffmpeg-full (Homebrew, keg-only) has libass for captions; the plain ffmpeg does not.
  ffmpeg: /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg
  ffprobe: /opt/homebrew/opt/ffmpeg-full/bin/ffprobe
live:
  chat:
    bin_s: 10             # chat is counted in bins of this many seconds
    burst_x: 4.0          # latest bin must be this many times the channel's own normal level (rehearsal 2026-11-17: 3.0 gave 15/h on a busy Kick chat, 4.0 gives 8/h and keeps every 6-9x spike)
    sustain_x: 1.8        # and the last 3 bins (30 s) this many times
    floor: 2.0            # baseline never below this (weighted msgs per bin), so quiet chats don't fire on 3 messages
    min_burst: 12         # and the burst must weigh at least this much
    warmup_bins: 12       # no spikes in the first 2 minutes of watching a channel
    baseline_bins: 60     # baseline = median of the last 10 minutes
    repeat_cap: 3         # copy-paste spam: the same message (first words) counts at most this often per bin
    repeat_min_words: 3   # only messages of this many words or more; "LOL" x50 and "KEKW KEKW KEKW" x50 are real hype, never capped
    hype_weight: 3        # LOL / W / OMG / clip it / laugh emotes count this much, other messages 1
    hype_words: [lol, lmao, lmfao, kekw, omegalul, lul, w, ww, www, omg, pog, poggers, pogchamp, clip, "clip it", "clip that", wtf, "no", nooo, rip, dead, "😂", "💀", icant, "?!"]
  loud_trigger: no_chat   # loudness trigger on the live recording: no_chat (only channels without a chat reader) | always | off
  loud:
    bin_s: 1              # loudness is measured per second of each finished chunk
    burst_s: 6            # median of the last 6 s (one bang alone does not fire) ...
    z: 4.0                # ... must be this many robust std-devs above the channel's own normal (rehearsal 2026-11-17: z binds, not min_ratio; with cooldown 90 = 9/h Kick, 4/h YouTube; 4.5 lost a kept clip)
    min_ratio: 1.6        # and at least this many times its median loudness (real bursts were 3.5-6x, so this rarely binds)
    baseline_s: 600       # normal = median of the last 10 minutes
    warmup_s: 90          # no triggers in the first 90 s of watching a channel
    cooldown_s: 90        # one trigger per burst (20 s let one shouting stretch fire 4 times in 4 min)
  pre_roll_s: 40          # chat reacts late: cut this much before the spike
  post_roll_s: 30         # and this much after
  merge_s: 60             # spikes of one channel closer than this are one moment
  max_window_s: 100
  min_len_s: 15           # contiguous video needed; shorter (ad gaps) is dropped
  hole_s: {kick: 10}      # Kick names chunks in bursts (lag up to 30 s, then catches up; jitter ±5 s): measure chunks, a hole = lag that stays > this. Others: fixed 10 s grid
  chunk_s: 10             # Tier A recording is cut into chunks named by wall-clock time
  keep_h: 12              # raw recordings and segments are deleted after this (12 h since 1080p, 2026-11-18)
  quality: "1080p60,1080p,720p60,best"   # 1080p since 2026-11-18 (109 Mbps line). What Tier A records and Tier B fetches. 1080p60 is ~8.5 Mbps per stream; 720p60 ~3-5. Clips are 30 fps. Override per streamer with `quality:` in streamers.yaml
  max_rewinds: 2          # Tier B rewinds downloading at once; more spikes at the same time are skipped (each one is a full stream download)
  tier_b_duration_s: 80   # Tier B: Twitch rewind gives ~30-50 s back, then it records forward to this length
  loud_z: 1.8
