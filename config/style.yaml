# The look. Changing the look never means changing code.
# Colours are hex RRGGBB. Sizes are pixels on the 1080x1920 output.

output:
  width: 1080
  height: 1920
  fps: 30
  crf: 20              # lower = better quality, bigger file
  loudness_lufs: -14   # loudness target for Shorts/TikTok/Reels

# auto = layout A when the streamer's facecam is visible in the clip, else B.
# Or force one: A (facecam top), B (gameplay only), C (16:9 middle + title box).
layout: auto

# Try other layouts on a share of clips so analytics (M8) can tell which gets more views.
# Each entry: share of clips (0-1) rendered in that layout instead of the auto choice.
# A is only used when the streamer has a facecam. Picked by a hash of the clip, so re-renders are stable.
# Subtle colour grade on the picture (not the captions). Barely visible on its own; streams look less flat.
grade:
  enabled: true
  contrast: 1.05
  saturation: 1.12
  brightness: 0.0
  gamma: 0.98
  sharpen: 0.45           # unsharp amount after upscaling (0 = off; >0.8 starts to look crunchy)

# Usability gate before every render (user 2026-11-18: "make sure they're at least usable so I can post").
# Fixes what it can (smaller cam panel, or full-game layout C); refuses a clip only when nothing works.
checks:
  enabled: true
  min_source_h: 700          # below 720p the clip looks blurry: refuse
  face_in_cam: 0.5           # the cam box must show a face in this share of samples, else no cam (C)
  max_cam_upscale: 3.0       # shrink the cam panel until the cam is blown up at most this much...
  min_cam_height: 0.30       # ...but not below this share of the height (smaller = more zoomed game)
  max_cam_upscale_hard: 4.0  # still over this at the smallest panel: cam too tiny/blurry, use C
  min_game_width: 0.42       # the game crop must keep this share of the game's width (B keeps 32%: becomes C)

layout_mix:
  C: 0.1   # user 2026-11-19: facecam-top (A) is best; C (no title) only as a small variant + fallback

layout_a:
  cam_height: 0.45        # share of the frame height the facecam takes. Was 0.38; user 2026-11-18: "face cam bigger, game not so zoomed in" (game crop 51% -> 58% of the width)
  cam_focus_y: 0.5        # where to crop the cam vertically if it is too tall (0 top, 1 bottom)
  gameplay_focus_x: 0.5   # which part of the wide gameplay to keep (0 left, 0.5 centre, 1 right)
  cam_presence: 0.5       # facecam must be seen in this share of the clip to use A (else B)
  switch_min_s: 2         # if the cam is off this long inside an A clip, switch to B for that part
  cutout:                 # borderless green-screen cams (IShowSpeed): found by face, not by a frame
    enabled: true
    cam_height: 0.42      # was 0.30; user 2026-11-18: Speed's face cam "very very small", doesn't fill the top
  divider:                # thin line between the face panel and the game (2026-11-18, "small details")
    enabled: true
    px: 6
    color: black
    opacity: 0.9
    shadow: [0.35, 0.2, 0.1]   # 2 px rows fading out under the line

layout_b:
  gameplay_focus_x: 0.5
  black_band_to_c: 0.15   # source has a black band this share of its height or more (multi-POV overlays) -> use C

layout_c:
  video_center_y: 0.5     # vertical centre of the picture (share of height)
  picture_height: 0.46    # share of the frame height the picture fills; sides are cropped = zoomed in. 0 = whole 16:9 frame (user 2026-11-18: lines drawn under the title and under the captions)
  focus_x: 0.5            # which part of the wide game to keep when cropping the sides
  caption_in_picture: true   # captions sit on the lower part of the picture instead of below it
  crop_black_bars: true   # cut the black bars some sources have at the top and bottom
  background: blur        # blur | black
  blur: 40
  title_box:
    enabled: false        # user 2026-11-19: no burned-in title, they add their own text when posting
    style: text           # text = outlined text, no box (default) | box = white rounded box
    line_colors: [FFFFFF, FF2D2D]   # lines alternate: white, red
    outline_color: "000000"
    outline: 12
    shadow: 5
    pop_from: 85          # title pops in from this scale (%), like the captions
    pop_ms: 120
    color: FFFFFF
    text_color: "000000"
    font_size: 96
    uppercase: true
    radius: 36
    padding_x: 44
    padding_y: 30
    margin_x: 60          # gap between box and frame edge
    gap: 36               # gap between box and picture
    max_lines: 3

# Launch hook banner on layout A/B clips (they have no title box): "GTA 6 IS ALREADY OUT" over the top.
# Only shows when the title starts with a launch hook (settings.yaml judge.launch). Preview 2026-11-18.
launch_banner:
  enabled: false      # user 2026-11-19: no burned-in title/hook text at all (they add their own when posting). Was: true;      # user approved the 3.5 s version 2026-11-18; only on lower-rated clips (settings judge.launch.on_video_max_score)
  show_s: 3.5         # seconds on screen from the start (never the whole clip)
  # Two-tone lines (line 1, line 2), one palette per clip picked from the title so the feed varies. Mostly white + one accent.
  palettes:
    - [FFFFFF, FFE600]   # white / yellow
    - [FFE600, FFFFFF]   # yellow / white
    - [FFFFFF, 3CFF3C]   # white / green
    - [FFFFFF, FF4040]   # white / red
    - [FFFFFF, 40C8FF]   # white / sky blue
  y_a: 0.12           # centre, share of height (layout A: over the top of the facecam)
  y_b: 0.15           # layout B
  font_size: 118      # too wide for one line -> two balanced lines at this size
  margin_x: 50
  outline: 12
  shadow: 5
  pop_from: 70
  pop_ms: 140

captions:
  font: Nunito Black      # family name inside the font file
  font_file: Nunito-Black.ttf   # in assets/fonts/
  size: 112               # user 2026-11-19: "slightly smaller, not a lot" (was 124, then 116 earlier today)
  uppercase: true
  color: FFFFFF
  outline_color: "000000"
  outline: 10
  shadow: 0
  highlight_colors: [3CFF3C, FFE600]   # key words, used in turn
  never_highlight: [fuck, fucking, fucked, motherfucker, shit, ass, bitch, damn, man, bro, oh, yeah, like]
  mask_profanity: true    # FUCKING -> F***ING (approved 2026-11-17): first letter and ending stay
  mask_roots: [fuck, shit, bitch, cunt, nigg, fag, dick, pussy, whore, slut]
  words_per_caption: 2
  max_chars: 14           # a caption never gets longer than this
  break_gap_s: 0.5        # a pause this long starts a new caption
  hold_s: 0.35            # keep a caption up this long after its last word
  min_show_s: 0.25
  max_word_s: 0.6         # a word longer than this starts this long before its end (Whisper timing fix)
  lead_s: 0.1             # show each caption this much before the word is spoken (feels in sync)
  pop_from: 75            # pop-in starts at this % size...
  pop_ms: 90              # ...and grows to 100 % in this many ms
  keep_punctuation: "?!"
  # vertical position of the caption centre
  position_a: seam        # seam = on the line between facecam and gameplay
  position_b: 0.62        # share of height
  position_c: below_video # just under the picture

reaction_tags: false      # *SECURITY* style tags in silent parts (not built yet)
# ---- S8 look upgrades. Each is off until you approve it. ----

# Sound effects on key moments, placed from the transcript words and the loudness.
# Sounds live in assets/sfx/ (CC0, see assets/LICENCES.md and assets/sfx/sounds.yaml).
sound_effects:
  enabled: true   # user approved after preview2, 2026-11-18
  volume_db: 0            # master gain on all effects (on top of each kind's gain)
  max_per_clip: 2         # reaction hits (not counting intro, riser, cut whooshes). Was 4; user 2026-11-18: big hits overused
  min_gap_s: 6            # at least this long between two reaction hits (was 3)
  edge_s: 0.6             # no reaction hits this close to the clip start/end
  intro_whoosh: true      # a whoosh as the clip opens
  intro_sound: whoosh-medium-hard
  intro_gain_db: 8        # measured: at 0 it added only +0.4..2 dB in its band on 5 of 6 clips
  cut_sound: whoosh-fast-hard   # on each layout switch (webcam <-> full gameplay)
  cut_gain_db: 6
  # The payoff: the strongest reaction hit (else the loudest clear peak). A riser builds into it,
  # so the hit lands on the riser's top.
  payoff:
    enabled: true
    risers: [riser-2s-strong, riser-1s-strong]   # the longest that fits before the payoff
    riser_gain_db: 7      # was 10 (2 was inaudible); a riser should sit in the background
    min_start_s: 0.8      # the riser may not start before this (keeps it off the intro whoosh)
    peak_db: 20           # no reaction words: a peak this far above the median still counts. Was 12: the "big sound effect" (boom-hit-strong) then landed on most clips; user 2026-11-18: "only where you really need it"
    onset_db: 6           # ...and the hit lands where the voice first comes within this of that peak
    hit: boom-hit-strong
    hit_gain_db: 3        # was 8: "a bit too loud" (user 2026-11-18)
    layer: impact-heavy-hard  # see the bro_what note
    layer_gain_db: 7      # was 12 ("too loud", user 2026-11-18); at 7 it sits 6-8 dB under a shout
  # A word trigger only fires when the voice is this many dB above the clip's median loudness
  # (so a calm "what" does nothing; a shouted one does).
  word_loud_db: 6
  # The voice dips this much for duck_s under each hit, so the hit is heard over a shout
  # (measured: a hit on a shout sat 10-11 dB under the voice in the band phones play).
  duck_db: 5
  duck_s: 0.25
  kinds:                  # checked in this order of priority when two compete
    bro_what:
      phrases: ["bro what", "wait what", "what the fuck", "what the hell", "what the heck", "excuse me",
                "are you serious", "are you kidding me", "huh", "what"]
      isolate_s: 0.3      # a one-word phrase ("what") only counts said on its own, with this much pause around it
      sound: boom-hit-medium
      gain_db: 10.5       # was 8: "slightly louder" (user, 2026-11-17)
      at: start           # start | end | peak of the phrase
      # Booms are bass (30-150 Hz): +13..23 dB there, but ~0 dB in 250-2000 Hz, the band phone speakers
      # play. So a crisp impact goes on top: that is the part you hear on a phone.
      layer: impact-heavy-hard
      layer_gain_db: 7
    hype:
      phrases: ["let's go", "lets go", "oh my god", "oh my gosh", "no way", "yo yo yo", "bro bro bro"]
      sound: bass-808-medium
      gain_db: 6
      at: start
      layer: impact-heavy-hard
      layer_gain_db: 4
    fail:
      phrases: ["no no no", "no no", "oh no", "i'm dead", "we're dead", "i died", "wasted", "bruh",
                "i'm done", "nooo", "noo", "it's over", "we lost"]
      sound: notification-failure-wobble
      gain_db: 8
      at: end
    laugh:                # Whisper usually drops laughter, so this only fires on written laughs
      phrases: ["haha", "hahaha", "hahahaha", "lmao", "lol", "hehe", "lmfao"]
      sound: pop-large-bubble
      gain_db: 3
      at: start
    scream:               # no words needed: a very loud burst above the clip's median
      loud_db: 15
      min_len_s: 0.3
      sound: boom-drop-strong
      gain_db: 9
      layer: impact-heavy-hard
      layer_gain_db: 8
      at: after           # in the gap right after the scream (under it the scream hides any sound)
      gap_db: 6           # "gap" = voice back within this many dB of the median...
      gap_max_s: 1.2      # ...looked for up to this long after the scream

# Circles + arrows, ONLY where they help (user, 2026-11-17): (1) the hook, when the opening words name
# someone or something on screen ("oh he's running"), and (2) when the streamer says "look at that" etc.
# A local vision model finds the thing, a tracker follows it. Any doubt = no mark. Most clips get none.
# Set by hand with `studio mark` (overrides).
marks:
  enabled: false  # user 2026-11-18: off. Marks must stay glued to the object (After Effects-style track); ours drifted when the camera turned. No mark beats a loose one
  hook: true
  hook_words_s: 4.0       # the hook = words said in the first this-many seconds
  cues: true
  cue_phrases: ["look at that", "look at this", "look at him", "look at her", "look here", "look look",
                "right there", "see that", "do you see", "over there"]
  follow_s: 3.0           # how long the mark follows its target
  max_per_clip: 2
  vlm_model: gemma4:26b   # Ollama, multimodal
  min_sure: 0.7           # the model's own confidence, at least
  min_box: 0.002          # target box as a share of the gameplay picture
  max_box: 0.15           # bigger = it already fills the screen, no mark needed
  track_fps: 10
  max_lost: 0.3           # tracker may lose the target in at most this share of frames
  kind: both              # circle | arrow | both
  color: FF2D2D
  outline_color: "000000"
  thickness: 12
  pop_ms: 140
  show_s: 1.4             # hand-set still marks
  max_radius: 220         # px on the output

# Face tracking: the facecam crop (layout A) follows the face inside the cam box, and clips with no
# cam box but a big, steady face (full-screen camera) get a gameplay crop that follows the face.
face_track:
  enabled: true   # user approved after preview2, 2026-11-18
  sample_fps: 5
  min_face_w: 0.06        # full-screen camera: face at least this share of the frame width
  presence: 0.4           # ...seen in this share of the samples (missed ones hold the last spot)
  deadband: 0.06          # ignore face moves smaller than this share of the crop width
  smooth_s: 0.7           # time constant of the follow (bigger = calmer)
  max_speed: 0.5          # crop widths per second, at most
